
{% extends 'base.html' %}

{% block title %}Upload Dataset{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Upload Dataset CSV</h1>

        {% if messages %}
            {% for message in messages %}
                <p class="success-message">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Upload
            </button>

        </form>

    </div>

</div>

{% endblock %}
