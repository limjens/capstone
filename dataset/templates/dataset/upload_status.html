
{% extends 'base.html' %}

{% block title %}Upload Status{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Upload #{{ upload.pk }}</h1>

        <p>
            Status:
            <strong>{{ upload.status }}</strong>
        </p>

        <p>
            Total rows:
            <strong>{{ upload.total_rows }}</strong>
        </p>

        <p>
            Clean rows:
            <strong>{{ upload.clean_rows }}</strong>
        </p>

        <p>
            Flagged rows:
            <strong>{{ upload.flagged_rows }}</strong>
        </p>

    </div>

</div>

{% endblock %}
