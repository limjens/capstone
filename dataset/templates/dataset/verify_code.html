
{% extends 'base.html' %}

{% block title %}Enter Verification Code{% endblock %}

{% block content %}

<div class="container">

    <div class="card">

        <h1>Enter Verification Code</h1>

        <p>
            Upload #{{ upload.pk }} — check the approval email
            for your 6-digit code.
        </p>

        {% if error %}
            <p class="error-message">
                {{ error }}
            </p>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <div class="form-group">
                <label for="verification_code">
                    Verification Code
                </label>

                <input
                    type="text"
                    id="verification_code"
                    name="verification_code"
                    maxlength="6"
                    placeholder="123456"
                    required
                >
            </div>

            <button type="submit">
                Verify
            </button>

        </form>

    </div>

</div>
