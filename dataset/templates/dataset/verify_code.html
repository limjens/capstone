<!DOCTYPE html>
<html>
<head><title>Enter Verification Code</title></head>
<body>
  <h1>Enter Verification Code</h1>
  <p>Upload #{{ upload.pk }} — check the approval email for your 6-digit code.</p>

  {% if error %}
    <p style="color: red;">{{ error }}</p>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="text" name="verification_code" maxlength="6" placeholder="123456" required>
    <button type="submit">Verify</button>
  </form>
</body>
</html>
