{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block content %}

<div class="card">

  <h1 class="headline">Create New Account</h1>

  <form method="post">
    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
      Create Account
    </button>
  </form>

  <p>
    <a href="{% url 'accounts:account_list' %}">
      Cancel
    </a>
  </p>

</div>

{% endblock %}
